name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch so a rapid series of pushes does
# not burn the minutes queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # Fast feedback: no services, no bundling. Runs on every push.
  static:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The artwork is generated by tools/generate-assets.mjs and committed. This
      # asserts the committed files are the ones app.json points at, that they
      # are the right size, that the app icon carries no alpha channel (App Store
      # Connect rejects that) and that the mark actually covers the canvas rather
      # than rendering empty. A blank or off-canvas icon passes every other check
      # in this pipeline.
      - name: Build readiness (assets, icon, project id)
        run: npm run build:check

      # The marketing site is static, so its failure modes are all checkable
      # from the source: a raw colour outside the token block, a gradient-filled
      # wordmark, a dead internal link, an invented metric in the copy, a JSON-LD
      # block that asserts a price or a rating no store listing backs. This gates
      # those. The visual gates (contrast, fold fit, clickable-text wrap) need a
      # browser and are not covered here.
      - name: Marketing site audit
        run: npm run site:audit

      # The policy page is generated from docs/privacy-policy.md, the theme
      # toggle is injected into all five pages and styles.css by
      # tools/build-theme-toggle.mjs, the share images are rendered in headless
      # Chrome by tools/build-og-images.mjs, and the search plumbing (sitemap,
      # robots, canonical, JSON-LD) is generated from the table in
      # tools/build-seo.mjs. All four write into site/, and the order matters:
      # the SEO pass rewrites the head of the page the policy pass emits, and
      # the toggle must be applied AFTER the policy pass or the regenerated
      # page silently loses its control. If any drift from its source, the
      # committed output is stale.
      #
      # The share images are rendered, not diffed for staleness: PNG bytes are not
      # stable across Chrome versions, so a re-render on a different runner would
      # fail the diff on identical input. --verify instead asserts each card was
      # typeset in the brand face, and the site audit checks the committed files
      # are 1200x630 PNGs pointing at the right page.
      - name: Generated site files are in sync
        run: |
          set -euo pipefail
          npm run site:build
          if ! git diff --quiet -- site/*.html site/*.css site/sitemap.xml site/robots.txt; then
            echo "::error::generated site files are stale. Run: npm run site:build"
            git diff --stat -- site/ | head -20
            git diff -- site/ | head -60
            exit 1
          fi
          echo "policy page, theme toggle, styles, sitemap, robots and JSON-LD are in sync with their sources"

      - name: Share images render in the brand face
        run: npm run site:og:verify

  # Proves the game actually plays: two real Socket.IO clients against a real
  # Postgres, asserting answer privacy, reveal sync, reconnection, DEEPER+
  # gating and the persisted rows.
  integration:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: deeper
          POSTGRES_PASSWORD: deeper
          POSTGRES_DB: deeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://deeper:deeper@localhost:5432/deeper
      REDIS_URL: redis://localhost:6379
      # Lets the smoke test prove a live game survives a hard server restart.
      SMOKE_REDIS_URL: redis://localhost:6379
      LIVE_STATE_SECRET: ci-live-state-secret-value-not-for-production
      # Exercise the real production behaviour: premium decks stay locked.
      PREMIUM_ENFORCEMENT: 'on'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply migrations
        run: npm --workspace infra/postgres run migrate

      - name: Seed question catalog
        run: npm --workspace infra/postgres run seed

      - name: Two-client smoke test
        run: npm --workspace @deeper/server run smoke

  # A static import that throws on load used to take down the entire route
  # graph in Expo Go, and nothing in the test suite would have caught it. This
  # job is the canary for that whole class of bug.
  bundle:
    name: Bundle (android + ios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist-android

      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir dist-ios

      - name: Assert bundles were produced
        run: |
          set -euo pipefail
          for dir in dist-android dist-ios; do
            if [ ! -d "$dir/_expo/static/js" ]; then
              echo "::error::$dir produced no JavaScript bundle"
              exit 1
            fi
            echo "$dir OK: $(du -sh "$dir" | cut -f1)"
          done
